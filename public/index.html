<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 历史对话</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <canvas id="matrixCanvas" class="matrix-canvas"></canvas>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="source-switch" role="group" aria-label="历史来源">
          <button id="claudeSource" type="button" data-source="claude">Claude</button>
          <button id="codexSource" type="button" data-source="codex">Codex</button>
        </div>
        <div id="rootPath" class="root-path"></div>
        <div class="view-switch" role="group" aria-label="目录展示方式">
          <button id="timeView" type="button">
            <span>时间</span>
            <span id="timeOrderIcon" class="order-icon" aria-hidden="true">▼</span>
          </button>
          <button id="projectView" type="button">项目</button>
        </div>
        <input id="searchInput" type="search" placeholder="搜索历史对话" autocomplete="off" />
        <div id="searchSummary" class="search-summary"></div>
      </div>
      <nav id="tree" class="tree"></nav>
    </aside>
    <div class="resizer-col">
      <div id="sidebarResizer" class="sidebar-resizer" role="separator" aria-label="调整目录宽度" aria-orientation="vertical" tabindex="0"></div>
    </div>
    <main class="main">
      <header class="session-header">
        <div style="display: flex; gap: 12px; align-items: flex-start;">
          <button id="toggleSidebar" class="ghost-button" style="padding: 0 8px; font-size: 16px;" type="button" aria-label="切换目录" title="切换目录">◨</button>
          <div>
            <h2 id="sessionTitle" contenteditable="true" spellcheck="false" title="点击编辑标题">选择一个会话</h2>
            <div id="sessionPath" class="session-path"></div>
            <div id="sessionMeta" class="session-meta"></div>
          </div>
        </div>
        <div class="header-actions">
          <button id="refreshButton" class="ghost-button" type="button">刷新</button>
          <button id="toggleSystem" class="ghost-button" type="button">显示系统及工具</button>
          <div class="theme-switch">
            <button id="themeToggle" class="ghost-button" type="button" aria-label="切换主题" title="切换主题">🎨</button>
            <div id="themePanel" class="theme-panel" hidden>
              <button data-theme="github" style="--dot:#0969da">GitHub</button>
              <button data-theme="solarized" style="--dot:#268bd2">Solarized</button>
              <button data-theme="tokyo" style="--dot:#7aa2f7">Tokyo Night</button>
              <button data-theme="dracula" style="--dot:#bd93f9">Dracula</button>
              <button data-theme="catppuccin" style="--dot:#cba6f7">Catppuccin</button>
              <button data-theme="gruvbox" style="--dot:#d79921">Gruvbox</button>
            </div>
          </div>
        </div>
      </header>
      <section id="chat" class="chat"></section>
      <div class="scroll-actions" aria-label="聊天滚动">
        <button id="scrollTop" class="scroll-button" type="button" aria-label="回到顶部">↑</button>
        <button id="scrollBottom" class="scroll-button" type="button" aria-label="回到底部">↓</button>
      </div>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
